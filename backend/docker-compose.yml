services:
  db:
    image: mysql:8.4
    container_name: biblioteca-db
    restart: always
    environment:
      MYSQL_DATABASE: biblioteca
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: biblioteca-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
